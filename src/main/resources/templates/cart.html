<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="author" content="Untree.co">
<link rel="shortcut icon" href="favicon.png">

<meta name="description" content="" />
<meta name="keywords" content="bootstrap, bootstrap4" />

<!-- Bootstrap CSS -->
<link href="css/bootstrap.min.css" rel="stylesheet">
<link
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
	rel="stylesheet">
<link href="css/tiny-slider.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<title>Furni - Your Shopping Cart</title>
</head>

<body>

	<!-- Start Header/Navigation -->
	<div th:replace="header :: header"></div>
	<!-- End Header/Navigation -->

	<!-- Start Hero Section -->
	<div class="hero">
		<div class="container">
			<div class="row justify-content-between">
				<div class="col-lg-5">
					<div class="intro-excerpt">
						<h1>Cart</h1>
					</div>
				</div>
				<div class="col-lg-7">
					<!-- Additional content if needed -->
				</div>
			</div>
		</div>
	</div>
	<!-- End Hero Section -->

	<div class="untree_co-section before-footer-section">
		<div class="container">
			<div class="row mb-5">
				<form class="col-md-12" method="post" th:action="@{/cart/update}">
					<div class="site-blocks-table">
						<table class="table">
							<thead>
								<tr>
									<th class="product-thumbnail">Image</th>
									<th class="product-name">Product</th>
									<th class="product-price">Price</th>
									<th class="product-quantity">Quantity</th>
									<th class="product-total">Total</th>
									<th class="product-remove">Remove</th>
								</tr>
							</thead>
							<tbody>
								<!-- Iterate over the products in the cart -->
								<tr th:each="cart : ${carts}">
									<div th:each="product : ${cart.products}">
									<td class="product-thumbnail">
										<!-- Assuming each product has an 'imageUrl' property --> 
										<img
										th:src="@{'/image/' + ${product.id}}" class="img-fluid">



									</td>
									<td class="product-name">
										<h2 class="h5 text-black" th:text="${product.itemName}">Product
											Name</h2>
									</td>
									<td th:text="${product.itemPrice}">Price</td>
									<td>
										<!-- Quantity Handling (Assuming Quantity is 1 for simplicity) -->
										<div
											class="input-group mb-3 d-flex align-items-center quantity-container"
											style="max-width: 120px;">
											<div class="input-group-prepend">
												<button class="btn btn-outline-black decrease" type="button">&minus;</button>
											</div>
											<input type="text"
												class="form-control text-center quantity-amount" value="1"
												placeholder="" aria-label="Example text with button addon"
												aria-describedby="button-addon1">
											<div class="input-group-append">
												<button class="btn btn-outline-black increase" type="button">&plus;</button>
											</div>
										</div>
									</td>
									<td th:text="${product.itemPrice}">Total</td>
									<td>
										<form th:action="@{/cart/remove/{id}(id=${product.id})}"
											method="post">
											<code type="submit" class="btn btn-black btn-sm">
												X
												</button>
										</form>
									</td>
									</div>
									</tr>
								<!-- If cart is empty, show a message -->
								<!-- 	<tr th:if="${#lists.isEmpty(cart.products)}">
									<td colspan="6" class="text-center">Your cart is empty.</td>
								</tr> -->
								</tr>
							</tbody>
						</table>
					</div>
					<!-- Optionally, add an Update Cart button if implementing quantity updates -->
				</form>
			</div>

			<div class="row">
				<div class="col-md-6">
					<div class="row mb-5">

						<div class="col-md-6">
							<a href="/" class="btn btn-outline-black btn-sm btn-block">Continue
								Shopping</a>
						</div>
					</div>
					<div class="row">
						<div class="col-md-12">
							<label class="text-black h4" for="coupon">Coupon</label>
							<p>Enter your coupon code if you have one.</p>
						</div>
						<div class="col-md-8 mb-3 mb-md-0">
							<input type="text" class="form-control py-3" id="coupon"
								name="coupon" placeholder="Coupon Code">
						</div>
						<div class="col-md-4">
							<button class="btn btn-black" type="submit">Apply Coupon</button>
						</div>
					</div>
				</div>
				<div class="col-md-6 pl-5">
					<div class="row justify-content-end">
						<div class="col-md-7">
							<div class="row">
								<div class="col-md-12 text-right border-bottom mb-5">
									<h3 class="text-black h4 text-uppercase">Cart Totals</h3>
								</div>
							</div>
							<div class="row mb-3">
								<div class="col-md-6">
									<span class="text-black">Subtotal</span>
								</div>
								<div class="col-md-6 text-right">
									<strong class="text-black" th:text="'$' + ${total}">Subtotal</strong>
								</div>
							</div>
							<div class="row mb-5">
								<div class="col-md-6">
									<span class="text-black">Total</span>
								</div>
								<div class="col-md-6 text-right">
									<strong class="text-black" th:text="'$' + ${total}">Total</strong>
								</div>
							</div>

							<div class="row">
								<div class="col-md-12">
									<a href="/checkout" class="btn btn-black btn-lg py-3 btn-block">Proceed
										To Checkout</a>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<!-- End of Row -->
		</div>
	</div>

	<!-- Start Footer Section -->
	<div th:replace="footer :: footer"></div>
	<!-- End Footer Section -->

	<script src="js/bootstrap.bundle.min.js"></script>
	<script src="js/tiny-slider.js"></script>
	<script src="js/custom.js"></script>
</body>
</html>
